version: 1
backend:
  phases:
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - bun install
    build:
      commands:
        - echo "Frontend built by Bun server at runtime"
  artifacts:
    baseDirectory: /dev/null
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
